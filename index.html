<!-- watch.html with dynamic playlists and crossfade -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalmStream - Watch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav id="navbar">
    <h1>CalmStream</h1>
    <div class="nav-right">
      <button id="soundToggle" class="sound-btn">🔇</button>
      <a href="index.html">Home</a>
    </div>
  </nav>

  <div class="playlist-selector">
    <button class="playlist-btn" data-playlist="All">All</button>
    <button class="playlist-btn" data-playlist="Rain">Rain</button>
    <button class="playlist-btn" data-playlist="Ocean">Ocean</button>
    <button class="playlist-btn" data-playlist="Forest">Forest</button>
  </div>

  <video id="player1" autoplay playsinline></video>
  <video id="player2" autoplay playsinline style="opacity:0; position:fixed; top:0; left:0;"></video>

  <script>
    const allVideos = ["videos/video1.mp4","videos/video2.mp4","videos/video3.mp4"];
    const playlists = {"All": allVideos, "Rain": allVideos, "Ocean": allVideos, "Forest": allVideos};

    let currentPlaylist = playlists["All"];
    let currentIndex = 0;
    const player1 = document.getElementById("player1");
    const player2 = document.getElementById("player2");
    let activePlayer = player1;
    let inactivePlayer = player2;

    const soundToggle = document.getElementById("soundToggle");
    let isMuted = localStorage.getItem("muted") === "true";
    player1.muted = player2.muted = isMuted;
    soundToggle.textContent = isMuted ? "🔇" : "🔊";

    function playNextVideo() {
      inactivePlayer.src = currentPlaylist[currentIndex];
      inactivePlayer.play().catch(() => { inactivePlayer.muted = true; inactivePlayer.play(); });

      inactivePlayer.style.transition = 'opacity 1.5s ease';
      inactivePlayer.style.opacity = 1;
      activePlayer.style.opacity = 0;

      // swap players
      [activePlayer, inactivePlayer] = [inactivePlayer, activePlayer];
      currentIndex = (currentIndex + 1) % currentPlaylist.length;
    }

    // Initial load
    activePlayer.src = currentPlaylist[currentIndex];
    activePlayer.play();
    currentIndex++;

    activePlayer.addEventListener("ended", playNextVideo);

    // Sound toggle
    soundToggle.addEventListener("click", () => {
      activePlayer.muted = inactivePlayer.muted = !activePlayer.muted;
      isMuted = activePlayer.muted;
      localStorage.setItem("muted", isMuted);
      soundToggle.textContent = isMuted ? "🔇" : "🔊";
    });

    // Playlist buttons
    document.querySelectorAll('.playlist-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentPlaylist = playlists[btn.dataset.playlist];
        currentIndex = 0;
        activePlayer.src = currentPlaylist[currentIndex];
        activePlayer.play();
        currentIndex++;
      });
    });

    // Auto-hide nav
    const navbar = document.getElementById('navbar');
    let navTimeout;
    function showNav() { navbar.style.top = '0'; clearTimeout(navTimeout); navTimeout = setTimeout(() => { navbar.style.top = '-60px'; }, 3000); }
    document.addEventListener('mousemove', showNav);
    showNav(); // initial call
  </script>
</body>
</html>
